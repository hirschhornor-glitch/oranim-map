<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>מיפוי כלל עירוני — ירושלים</title>
    <meta name="theme-color" content="#14141a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="מיפוי עירוני">
    <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #14141a; --panel: #1d1d26; --panel2: #23232e; --line: #33333f;
            --ink: #eceaf2; --dim: #a6a2b5; --faint: #74707f;
            --ce: #c084fc;    /* סגול = מסחר ותעסוקה */
            --fund: #e0a800;  /* זהב = קרן תחזוקה */
            --rent: #22c1a6;  /* טורקיז = דיור להשכרה */
            --warn: #f0883e;
            --accent: var(--ce);
        }
        html, body { height: 100%; }
        body { font-family: 'Assistant', system-ui, sans-serif; background: var(--bg);
               color: var(--ink); overflow: hidden; }
        #root { height: 100vh; display: flex; flex-direction: column; }
        .spin { width:34px;height:34px;border:3px solid #3a3a48;border-top-color:var(--ce);
                border-radius:50%; animation:sp 1s linear infinite; }
        @keyframes sp { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width:9px; height:9px; }
        ::-webkit-scrollbar-track { background:#1a1a22; }
        ::-webkit-scrollbar-thumb { background:#3d3d4b; border-radius:5px; }
        button, input, select { font-family: inherit; color: inherit; }
        a { color: inherit; }

        header { padding: 12px 18px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
        h1 { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
        .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
        .tabs { display: flex; gap: 6px; margin-top: 10px; }
        .tab { padding: 8px 15px; border: 1px solid var(--line); border-bottom: none;
               background: var(--bg); color: var(--dim); border-radius: 9px 9px 0 0;
               cursor: pointer; font-size: 13.5px; font-weight: 700; }
        .tab.on { background: var(--panel2); color: var(--ink); }
        .tab.ce.on   { box-shadow: inset 0 3px 0 var(--ce); }
        .tab.fund.on { box-shadow: inset 0 3px 0 var(--fund); }
        .tab.rent.on { box-shadow: inset 0 3px 0 var(--rent); }

        .kpis { display: flex; gap: 9px; padding: 11px 18px 0; flex-wrap: wrap; }
        .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
               padding: 8px 12px; min-width: 128px; }
        .kpi .n { font-size: 18px; font-weight: 800; color: var(--accent);
                  font-variant-numeric: tabular-nums; }
        .kpi .l { color: var(--dim); font-size: 11.5px; margin-top: 1px; }

        .bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding: 10px 18px; }
        .bar input, .bar select {
            background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 9px; font-size: 12.5px; }
        .bar input { min-width: 190px; }
        .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
               padding: 6px 11px; font-size: 12.5px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #2c2c39; }
        .spacer { flex: 1; }
        .warnpill { color: var(--warn); font-size: 12px; border: 1px solid #5d3a1c;
                    background: #2a1c10; border-radius: 999px; padding: 3px 10px; font-weight: 700; }

        .split { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--line); }
        .list { width: 54%; min-width: 380px; overflow: auto; border-left: 1px solid var(--line); }
        #cmap { flex: 1; min-width: 0; background: #14141a; }

        table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--line);
                 vertical-align: top; }
        th { position: sticky; top: 0; background: var(--panel); color: var(--dim);
             font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; z-index: 2; }
        th:hover { color: var(--ink); }
        tbody tr.row { cursor: pointer; }
        tbody tr.row:hover { background: #1b1b24; }
        tr.row.sel { background: #262633; box-shadow: inset 3px 0 0 var(--accent); }
        .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
        .hi { color: var(--accent); font-weight: 700; }
        .pill { display: inline-block; padding: 1px 7px; border-radius: 999px;
                font-size: 10.5px; font-weight: 700; border: 1px solid; white-space: nowrap; }
        .pill.ocr { color: var(--warn); border-color: #5d3a1c; background: #2a1c10; }
        .pill.stat { color: var(--dim); border-color: var(--line); background: var(--panel2); }
        .pill.nogeo { color: var(--faint); border-color: var(--line); background: transparent; }
        .empty { color: var(--faint); }
        .vis { color: var(--faint); font-size: 10px; cursor: help; margin-inline-start: 2px; }
        .vis.dup, .empty.dup { color: #d98b3a; }
        .detail { background: #191921; color: var(--dim); font-size: 12px; line-height: 1.6; }
        .detail b { color: var(--ink); }
        .quote { border-right: 3px solid var(--accent); padding: 4px 9px; margin: 5px 0;
                 background: #16161d; border-radius: 0 6px 6px 0; }
        .note { margin: 0 18px 10px; background: var(--panel); border: 1px solid var(--line);
                border-right: 3px solid var(--warn); border-radius: 9px; padding: 9px 13px;
                font-size: 12px; color: var(--dim); line-height: 1.65; }
        .note b { color: var(--ink); }
        .maplegend { background: rgba(29,29,38,.92); border: 1px solid var(--line);
                     border-radius: 8px; padding: 8px 11px; font-size: 11.5px;
                     color: var(--ink); line-height: 1.85; }
        .leaflet-container { background: #14141a; font-family: 'Assistant', sans-serif; }
        .leaflet-popup-content-wrapper { background:#23232e; color:#eceaf2;
                                         border:1px solid #4a4a5c; border-radius:10px; }
        .leaflet-popup-tip { background:#23232e; }
        .leaflet-popup-content { margin:9px 11px; font-size:12.5px; direction:rtl; }

        @media (max-width: 950px) {
            .split { flex-direction: column; }
            .list { width: 100% !important; min-width: 0 !important; flex: 1 1 55vh;
                    border-left: none; border-bottom: 1px solid var(--line); }
            #cmap { flex: 1 1 45vh; min-height: 240px; }
        }
        @media print {
            body { background:#fff; color:#000; overflow:visible; }
            #root { height:auto; display:block; }
            .split { display:block; }
            .list { width:100% !important; overflow:visible; border:none; }
            #cmap, .noprint, .tabs { display:none !important; }
            th { background:#eee; color:#000; position:static; }
            th, td { border-bottom:1px solid #ccc; }
            .kpi { border:1px solid #bbb; }
            .hi { color:#333; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
            <div class="spin"></div>
            <div style="color:#a6a2b5;font-weight:600;">טוען נתונים כלל עירוניים…</div>
        </div>
    </div>
    <script src="citywide.js?v=2026-09-15j"></script>
</body>
</html>
