<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>אורנים - תכנון עירוני</title>
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="אורנים">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://docs.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            overflow: hidden;
            height: 100vh;
        }

        #root { height: 100vh; display: flex; }

        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: margin-right 0.3s ease;
            z-index: 1000;
            position: relative;
        }

        .sidebar.collapsed {
            margin-right: -320px;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e94560;
        }

        .sidebar-header h1 {
            font-size: 1.5em;
            color: #fff;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 0.85em;
            color: #a0a0b0;
        }

        .sidebar-section {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a4a;
        }

        .sidebar-section h3 {
            font-size: 0.9em;
            color: #e94560;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .layer-group-title {
            font-size: 0.8em;
            color: #8888aa;
            margin: 10px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }

        .layer-item:hover { background: #2a2a4a; }

        .layer-item input[type="checkbox"] {
            margin-left: 10px;
            accent-color: #e94560;
            width: 16px;
            height: 16px;
            min-width: 16px;
            min-height: 16px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: #1a1a3a;
            border: 2px solid #555;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .layer-item input[type="checkbox"]:checked {
            background: #e94560;
            border-color: #e94560;
        }
        .layer-item input[type="checkbox"]:checked::after {
            content: '✓';
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
        }

        .layer-item label {
            cursor: pointer;
            font-size: 0.9em;
            flex: 1;
        }

        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

        .leaflet-tile-pane {
            background: #f2efe9;
        }

        .leaflet-control-attribution {
            font-size: 10px !important;
            opacity: 0.5 !important;
        }

        .wms-overlay {
            transition: opacity 0.3s ease;
        }

        .toggle-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
            background: #1a1a2e;
            color: white;
            border: 2px solid #e94560;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .toggle-btn:hover { background: #e94560; }

        .leaflet-popup-content {
            direction: rtl;
            text-align: right;
            margin: 0 !important;
            width: min(300px, 85vw) !important;
        }
        /* committee-decision popup — wider for comfortable reading of the long text */
        .decision-popup .leaflet-popup-content {
            width: min(500px, 95vw) !important;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            padding: 0;
            overflow: hidden;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .archived-popup .leaflet-popup-content-wrapper {
            background: #3a3a3a;
        }
        /* Projector recommendations: light theme — keeps the banner highlights readable.
           Override every text color the default popup CSS sets on the dark theme. */
        .projector-popup .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #1c1c1c;
            border-radius: 10px;
        }
        .projector-popup .leaflet-popup-content,
        .projector-popup .leaflet-popup-content * {
            color: #1c1c1c;
        }
        .projector-popup .leaflet-popup-tip {
            background: #ffffff !important;
        }
        .projector-popup .leaflet-popup-content {
            margin: 0 !important;
            width: 320px !important;
        }

        /* ---- Popup UX (.pp-*) ---- */
        .pp-root {
            font-family: 'Assistant', 'Heebo', Arial, sans-serif;
            direction: rtl;
            text-align: right;
            font-size: 12.5px;
            line-height: 1.55;
            color: #1c1c1c;
            --pp-accent: #616161;
        }
        .pp-header {
            background: linear-gradient(135deg, var(--pp-accent), color-mix(in srgb, var(--pp-accent) 75%, #000));
            color: #fff;
            padding: 10px 12px 8px;
            border-radius: 10px 10px 0 0;
            border-bottom: 3px solid color-mix(in srgb, var(--pp-accent) 60%, #000);
        }
        .pp-header * { color: #fff !important; }
        .pp-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
            word-break: keep-all;
        }
        .pp-subtitle {
            font-size: 11px;
            opacity: 0.88;
            margin-top: 3px;
            font-weight: 500;
        }
        .pp-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 5px;
            padding: 8px 12px 4px;
        }
        .pp-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 11px;
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1.4;
            white-space: nowrap;
        }
        .pp-card {
            margin: 8px 10px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            line-height: 1.5;
        }
        .pp-card--ps {
            background: #f0f7ff;
            border-right: 4px solid #0277bd;
        }
        .pp-card--kar {
            background: #faf3ec;
            border-right: 4px solid #8d6e63;
        }
        .pp-card-header {
            font-size: 10.5px;
            font-weight: 700;
            color: #5d4037;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pp-card-icon { font-size: 13px; }
        .pp-quote {
            font-weight: 600;
            line-height: 1.55;
        }
        .pp-quote--ps { color: #01579b; font-size: 12px; }
        .pp-quote--kar { color: #3e2723; font-size: 12px; }
        .pp-facts {
            margin-top: 6px;
            font-size: 11px;
            color: #1c1c1c;
            display: flex;
            flex-wrap: wrap;
            gap: 3px 8px;
        }
        .pp-detail-row {
            display: flex;
            gap: 6px;
            padding: 3px 0;
            font-size: 11.5px;
        }
        .pp-detail-row--multiline { flex-direction: column; gap: 2px; }
        .pp-detail-label {
            color: #607d8b;
            font-weight: 600;
            min-width: 80px;
        }
        .pp-desc {
            padding: 4px 12px 6px;
            font-size: 11.5px;
            color: #424242;
            line-height: 1.55;
        }
        .pp-overlap {
            margin: 6px 10px;
            padding: 6px 8px;
            background: #fff8e1;
            border-right: 3px solid #fbc02d;
            font-size: 11px;
            border-radius: 4px;
        }
        .pp-overlap-sub {
            color: #6d4c00;
            font-size: 10px;
            margin-top: 2px;
        }
        .pp-warn {
            color: #a16207;
            font-size: 10.5px;
            background: #fff8e1;
            padding: 4px 8px;
            border-radius: 3px;
        }
        .pp-details {
            margin: 4px 10px 8px;
            border-top: 1px solid #eceff1;
            padding-top: 4px;
        }
        .pp-details > summary {
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #1976d2;
            padding: 4px 0;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pp-details > summary::-webkit-details-marker { display: none; }
        .pp-details > summary::before { content: '▸'; transition: transform .15s; display: inline-block; }
        .pp-details[open] > summary::before { transform: rotate(90deg); }
        .pp-details-body {
            padding: 4px 0 2px;
            font-size: 11.5px;
            line-height: 1.5;
        }
        .pp-actions {
            display: flex;
            gap: 6px;
            padding: 8px 10px 10px;
            border-top: 1px solid #eceff1;
            background: #fafafa;
            border-radius: 0 0 10px 10px;
            flex-wrap: wrap;
        }
        .pp-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 11px;
            font-size: 11.5px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color .12s, transform .05s;
            border: none;
            font-family: inherit;
        }
        .pp-action:hover { transform: translateY(-1px); }
        .pp-action--primary {
            background: linear-gradient(135deg, #fff4cc, #ffe082);
            color: #5d4037 !important;
            border: 1px solid #c79100;
        }
        .pp-action--primary:hover {
            background: linear-gradient(135deg, #ffe082, #ffca28);
        }
        .pp-action--link {
            background: transparent;
            color: #0d47a1 !important;
            border: 1px solid #bbdefb;
            cursor: default;
        }
        /* תשריט-style permanent labels on passages + crossings. Mirror the
           green/red chips drawn on the projector's official planning map. */
        .leaflet-tooltip.tashrit-label {
            font-family: Assistant, Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            direction: rtl;
        }
        .leaflet-tooltip.tashrit-label-passage {
            background: #1b5e20;
            color: #ffffff;
            border: 1px solid #0d3a13;
        }
        .leaflet-tooltip.tashrit-label-crossing {
            background: #d32f2f;
            color: #ffffff;
            border: 1px solid #7f0000;
        }
        /* Hide the default tooltip arrow — the chip looks cleaner without it. */
        .leaflet-tooltip.tashrit-label::before { display: none; }
        /* Permanent institution-name labels for the edu_renewal_proximity layer */
        .leaflet-tooltip.edu-renewal-label {
            font-family: Assistant, Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.95);
            color: #333;
            border: 1.5px solid #8e24aa;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            direction: rtl;
            /* RTL fix: Leaflet abs-positions the tooltip from the right edge in an RTL
               container, shifting it a full width left. Anchor from the left so
               direction:'bottom' actually centers the label under the point. */
            left: 0;
            right: auto;
        }
        .leaflet-tooltip.edu-renewal-label::before { display: none; }
        .archived-popup .popup-header {
            background: linear-gradient(135deg, #4a4a4a, #3a3a3a) !important;
        }

        /* shavaz-popup: theme via CSS variables per kayam/future */
        .shavaz-kayam-popup .leaflet-popup-content-wrapper {
            background: #2e1a0e !important;
            --shavaz-body-bg: #2e1a0e;
            --shavaz-row-border: #4a2e1a;
            --shavaz-label-color: #c4956a;
            --shavaz-header-bg: linear-gradient(135deg, #5C2E0A, #8B4513);
            --shavaz-title-color: #fff;
            --shavaz-subtitle-color: #fff;
        }
        .shavaz-kayam-popup .leaflet-popup-tip { background: #2e1a0e !important; }
        .shavaz-future-popup .leaflet-popup-content-wrapper {
            background: #3d2a1a !important;
            --shavaz-body-bg: #3d2a1a;
            --shavaz-row-border: #5a3d2a;
            --shavaz-label-color: #d4a87a;
            --shavaz-header-bg: linear-gradient(135deg, #C4956A, #D2B48C);
            --shavaz-title-color: #fff;
            --shavaz-subtitle-color: #fff;
        }
        .shavaz-future-popup .leaflet-popup-tip { background: #3d2a1a !important; }
        .shavaz-popup .popup-header { background: var(--shavaz-header-bg); }
        .shavaz-popup .popup-header-title { color: var(--shavaz-title-color); }
        .shavaz-popup .popup-header-subtitle { color: var(--shavaz-subtitle-color); }
        .shavaz-popup .popup-body { background: var(--shavaz-body-bg); }
        .shavaz-popup .popup-row { border-bottom-color: var(--shavaz-row-border); }
        .shavaz-popup .popup-row-label { color: var(--shavaz-label-color); }
        .shavaz-popup .popup-footer { background: var(--shavaz-body-bg); border-top-color: var(--shavaz-row-border); }
        .shavaz-popup .popup-status-row { padding: 6px 16px; background: var(--shavaz-body-bg); border-bottom: 1px solid var(--shavaz-row-border); }

        .leaflet-popup-tip { border-top-color: #1a1a2e; }

        .popup-header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 14px 16px 10px;
            border-bottom: 2px solid #e94560;
        }

        .popup-header-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 2px;
            text-align: center;
        }

        .popup-header-subtitle {
            font-size: 12px;
            color: #8899bb;
            font-family: monospace;
            text-align: center;
        }

        .popup-body {
            padding: 12px 16px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #2a2a4a;
        }

        .popup-row:last-child { border-bottom: none; }

        .popup-row-label {
            font-size: 12px;
            color: #8888aa;
        }

        .popup-row-value {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .popup-footer {
            padding: 10px 16px;
            border-top: 1px solid #2a2a4a;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .popup-link {
            display: block;
            text-align: center;
            color: #5dade2;
            font-size: 13px;
            text-decoration: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .popup-link:hover { background: #2a2a4a; }

        .popup-btn-permit {
            display: block;
            text-align: center;
            background: #e94560;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .popup-btn-permit:hover { background: #c73650; }

        .popup-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            font-size: 13px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: auto;
        }
        .popup-icon-btn:hover { border-color: #aaa; color: #fff; }
        .shavaz-popup .popup-icon-btn { border-color: #6b4226; color: #c4956a; }
        .shavaz-popup .popup-icon-btn:hover { border-color: #c4956a; color: #fff; }

        .popup-btn-back {
            display: block;
            text-align: center;
            background: transparent;
            color: #5dade2;
            font-size: 12px;
            padding: 6px;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .popup-btn-back:hover { background: #2a2a4a; }

        .popup-status-badge {
            display: inline-block;
            background: #0f3460;
            color: #5dade2;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .permit-label {
            background: transparent !important;
            border: none !important;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        .popup-section-title {
            font-size: 11px;
            color: #fff;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            padding: 8px 0 4px;
            border-top: 1px solid #2a2a4a;
            margin-top: 4px;
        }

        .popup-pair {
            display: flex;
            gap: 8px;
        }

        .popup-pair-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0;
        }

        .popup-pair-label {
            font-size: 10px;
            color: #6a6a8a;
        }

        .popup-pair-value {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .popup-pair-value .multiplier {
            font-size: 11px;
            color: #5dade2;
            font-weight: 400;
            margin-right: 4px;
        }

        .popup-sub-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 2px 0 4px;
            font-size: 10px;
            color: #6a6a8a;
        }

        .popup-sub-row span {
            color: #8888aa;
        }

        .popup-prog-text {
            font-size: 11px;
            color: #7a7a9a;
            padding: 2px 0;
            line-height: 1.3;
            word-break: break-word;
        }

        .permit-detail-header {
            background: linear-gradient(135deg, #0D47A1, #1976D2);
            padding: 14px 16px 10px;
            border-bottom: 2px solid #5DADE2;
        }

        .leaflet-popup-close-button {
            color: #8888aa !important;
            font-size: 18px !important;
            top: 6px !important;
            right: auto !important;
            left: 8px !important;
        }

        .leaflet-popup-close-button:hover { color: #e94560 !important; }

        .layer-legend-btn {
            background: none;
            border: none;
            color: #6a6a8a;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            margin-right: auto;
        }
        .layer-legend-btn:hover { color: #e94560; }

        .legend-popup {
            position: fixed;
            top: 50%;
            right: 330px;
            transform: translateY(-50%);
            background: #1a1a2e;
            border: 1px solid #3a3a5a;
            border-radius: 12px;
            padding: 16px 20px;
            z-index: 2000;
            min-width: 220px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            color: #fff;
        }
        .legend-popup-title {
            font-size: 14px;
            font-weight: 700;
            color: #e94560;
            margin-bottom: 12px;
            text-align: center;
        }
        .legend-popup-close {
            position: absolute;
            top: 8px;
            left: 8px;
            background: none;
            border: none;
            color: #8888aa;
            font-size: 18px;
            cursor: pointer;
        }
        .legend-popup-close:hover { color: #e94560; }
        .legend-popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1999;
        }

        .scale-display {
            position: absolute;
            bottom: 30px;
            left: 10px;
            background: rgba(255,255,255,0.85);
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            z-index: 800;
            pointer-events: none;
        }

        .plan-search-wrap {
            position: relative;

        .legend-item {

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(8px); }

        /* Popup navigation for multiple features */
        .popup-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 6px 16px;

        }

            background: #2a2a4a;
            border: none;
            color: #e0e0e0;
            width: 26px;
            height: 26px;
            border-radius: 50%;

            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .popup-nav-btn:hover { background: #e94560; }

        /* GeoJSON layers get pointer cursor automatically via Leaflet */
        /* All panes pass clicks through; SVG containers too */
        .leaflet-pane {
            pointer-events: none !important;
        }
        /* SVG containers inside panes must also be none */
        .leaflet-pane svg {
            pointer-events: none !important;
        }
        /* Re-enable on actual interactive SVG paths */
        .leaflet-plans-pane path,
        .leaflet-permits-pane path,
        .leaflet-tama38-pane path,
        .leaflet-stations-pane path,
        .leaflet-archived-pane path {
            pointer-events: auto !important;
            cursor: pointer;
        }
        /* Topics pane: never interactive (hatch overlays only) */
        .leaflet-topics-pane path {
            pointer-events: none !important;
        }
        /* Popups and controls must be interactive */
        .leaflet-popup-pane,
        .leaflet-popup-pane * {
            pointer-events: auto !important;
        }
        .leaflet-control-container,
        .leaflet-control-container * {
            pointer-events: auto !important;
        }

        #map.leaflet-dragging,
        #map.leaflet-dragging *,
        #map.leaflet-dragging .leaflet-grab { cursor: grabbing !important; }

        /* Controls & popup elements */
        .leaflet-control-zoom a, .leaflet-control a { cursor: pointer !important; }
        .leaflet-popup-close-button { cursor: pointer !important; }
        .popup-link, .popup-btn-permit, .popup-btn-back { cursor: pointer !important; }

        /* Sidebar interactive elements */
        .layer-item, .layer-item label, .layer-item input[type="checkbox"] { cursor: pointer; }
        .layer-legend-btn { cursor: pointer; }
        .plan-search-item { cursor: pointer; }
        .plan-search-clear { cursor: pointer; }
        .btn-reset { cursor: pointer; }
        .basemap-select { cursor: pointer; }
        .toggle-btn { cursor: pointer; }

        /* ── Mobile sidebar close button (inside sidebar) ── */
        .sidebar-close-mobile {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.3em;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .sidebar-close-mobile:hover { background: #c73650; }

        /* ── Mobile overlay when sidebar is open ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* ── Mobile responsive ── */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: 85vw;
                max-width: 320px;
                min-width: unset;
                z-index: 1100;
                box-shadow: -4px 0 20px rgba(0,0,0,0.5);
                transition: transform 0.3s ease;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .sidebar.collapsed {
                margin-right: 0;
                transform: translateX(100%);
            }
            .sidebar:not(.collapsed) {
                transform: translateX(0);
            }
            .sidebar-close-mobile {
                display: flex;
            }
            .sidebar-overlay.visible {
                display: block;
            }
            .toggle-btn {
                position: fixed;
                top: max(60px, env(safe-area-inset-top));
                right: 10px;
                z-index: 1200;
                width: 44px;
                height: 44px;
                font-size: 1.4em;
            }
            .map-toolbar {
                top: max(60px, env(safe-area-inset-top)) !important;
                padding: 4px 4px !important;
                left: 10px !important;
                right: 60px !important;
                transform: none !important;
                max-width: none !important;
                width: auto !important;
                flex-wrap: wrap !important;
                overflow: visible !important;
                justify-content: center !important;
                gap: 2px !important;
            }
            .toolbar-sep {
                display: none !important;
            }
            .toolbar-btn {
                flex: 0 0 auto;
                padding: 4px 6px !important;
                min-height: 40px !important;
                min-width: 56px !important;
            }
            .toolbar-btn .toolbar-icon {
                width: 18px !important;
                height: 18px !important;
            }
            .toolbar-label {
                font-size: 9px !important;
            }
            .filter-panel {
                width: 100vw;
            }
            .filter-panel .filter-close-btn {
                padding: 8px 12px;
            }
            .layer-item {
                padding: 10px 8px;
            }
            .layer-item input[type="checkbox"] {
                width: 20px;
                height: 20px;
                min-width: 20px;
                min-height: 20px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100vw;
                max-width: 100vw;
            }
            .filter-panel {
                width: 100vw;
            }
            .map-toolbar {
                right: 55px !important;
                left: 8px !important;
            }
            .toolbar-btn {
                padding: 6px 6px !important;
                min-width: 40px;
            }
            .toolbar-label {
                font-size: 8px !important;
            }
            .annotations-modal,
            .units-modal {
                width: 100vw;
                max-width: 100vw;
                border-radius: 10px 10px 0 0;
            }
            .leaflet-popup-content {
                width: min(280px, 85vw) !important;
            }
        }

        /* ── Map Toolbar ── */
        .map-toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            display: flex;
            gap: 0;
            background: rgba(15, 15, 30, 0.94);

            flex-direction: column;

        /* ── Reports Menu Modal ── */
        .reports-menu-modal { max-width: 760px; width: 92vw; max-height: 85vh; overflow-y: auto; }
