        var h = (location.hash || "").replace(/^#/, "");
        location.replace("citywide/" + (h ? "#" + h : "#fund"));

    <style>
        body { font-family: system-ui, sans-serif; background: #14141a; color: #eceaf2;
               direction: rtl; display: flex; height: 100vh; margin: 0;
               align-items: center; justify-content: center; }

    </style>
</head>
