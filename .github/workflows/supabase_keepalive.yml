name: Supabase keepalive (matalot field updates)

# Supabase pauses a free project after 7 days without requests, and the /matalot/ dashboard's
# field updates then stop loading (happened 11/2026). One read every 3 days keeps it awake.
# The key is the project's publishable key — the same one the public page ships with.
on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from matalot_updates (fails loudly if the project is down)
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            "https://gfnugahulxzxtrvefeir.supabase.co/rest/v1/matalot_updates?select=id&limit=1" \
            -H "apikey: sb_publishable_${KEY_SUFFIX}")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
        env:
          KEY_SUFFIX: MRHHqNB6Z573oDhG4wS1CA_UQC9MR-_
