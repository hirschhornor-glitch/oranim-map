name: Update Tree-Cutting Permits

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC (09:00 Israel)
  workflow_dispatch:        # Manual trigger

# Avoid clashing with the app.js rebuild (deploy.yml) when both push to master.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install shapely

      - name: Fetch tree-cutting permits (Meirim API → data/tree_permits.json)
        run: python scripts/fetch_tree_permits.py

      - name: Commit updated data
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/tree_permits.json
          git diff --cached --quiet || git commit -m "auto: update tree-cutting permits [skip ci]"
          git push || true
