name: Update Tree-Cutting Permits

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC (09:00 Israel)
  workflow_dispatch:        # Manual trigger
    inputs:
      test_email:
        description: 'שלח מייל בדיקה של הרישיונות הפתוחים הנוכחיים (לאימות שהמייל עובד ב-CI)'
        type: boolean
        default: false

# Needed so the auto-commit step can push back to master.
permissions:
  contents: write

# Avoid clashing with the app.js rebuild (deploy.yml) when both push to master.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Persist PAT credentials so `git push` works (the default GITHUB_TOKEN
          # is read-only here — without this the push fails and was silently
          # swallowed by `|| true`, freezing the data). Mirrors deploy.yml.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install shapely

      - name: Fetch tree-cutting permits (יעל"ה MOAG API → data/tree_permits.json)
        env:
          # Notify by email when a NEW open-for-objection permit appears in the
          # area. If GMAIL_APP_PASSWORD isn't set as a repo secret, the script
          # just skips the email (the data update still runs).
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # When the manual "test_email" box is checked, email the CURRENT open
          # permits regardless of the new-vs-baseline diff — a live CI email test.
          TREE_PERMITS_FORCE_EMAIL: ${{ inputs.test_email }}
        run: python scripts/fetch_tree_permits.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tree_permits.json
          if git diff --cached --quiet; then
            echo "No change in tree_permits.json — nothing to commit."
            exit 0
          fi
          git commit -m "auto: update tree-cutting permits [skip ci]"
          # Rebase onto any concurrent pushes (deploy bot, manual) then push.
          # No `|| true` — a real push failure should surface, not hide.
          git pull --rebase --autostash origin master
          git push
