name: Detect New Plans (XPLAN)

on:
  schedule:
    - cron: '0 4 * * 0'  # Every Sunday at 04:00 UTC (07:00 Israel)
  workflow_dispatch:        # Manual trigger

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth google-auth-oauthlib google-api-python-client requests shapely pyproj

      - name: Run detection
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          # The script sends the new-plans notification via SMTP with a Gmail
          # App Password (GMAIL_APP_PASSWORD) — NOT the refresh token, which it
          # never reads. Without this secret every detection printed
          # "Email sent: no" and plans were added silently (2026-07-26).
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # EMAIL_RECIPIENT is optional: if the secret is unset it expands to ""
          # and the script falls back to its built-in default recipient.
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          # Run in place from scripts/ so the script's sibling modules
          # (scope_filter.py) resolve via its own sys.path insert, and the
          # repo-relative data/ fallback in the script can find the checkout.
          # --no-mavat: no browser available in CI.
          python scripts/detect_new_plans.py --update --no-mavat

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-plans-report
          path: |
            new_plans_report.json
            last_detection_summary.txt
