name: Update Transit Bus Stops

on:
  schedule:
    # רבעוני — ה-1 בינואר/אפריל/יולי/אוקטובר ב-05:00 UTC (שעה אחרי שבילי אופניים).
    - cron: '0 5 1 1,4,7,10 *'
  workflow_dispatch:   # הפעלה ידנית

# נדרש כדי שצעד ה-commit האוטומטי יוכל לדחוף חזרה ל-master.
permissions:
  contents: write

# מונע התנגשות עם בניית app.js (deploy.yml) וריענוני-דאטה אחרים הדוחפים ל-master.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # מתמיד PAT כדי ש-git push יעבוד (github.token ברירת המחדל read-only). מראה deploy.yml.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch bus stops (Open Bus/Stride → data/transit_bus_stops_jlm.geojson)
        run: python scripts/fetch_transit_bus_jlm.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transit_bus_stops_jlm.geojson
          if git diff --cached --quiet; then
            echo "No change in transit_bus_stops_jlm.geojson — nothing to commit."
            exit 0
          fi
          git commit -m "auto: update transit bus stops [skip ci]"
          # Rebase onto any concurrent pushes (deploy bot, manual) then push. No `|| true`.
          git pull --rebase --autostash origin master
          git push
