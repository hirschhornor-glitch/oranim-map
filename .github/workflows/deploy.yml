name: Build app.js from JSX source

# Runs only when the JSX source or build config changes.
# Builds app.js and commits it back to master, so GitHub Pages
# (which deploys from master root) serves the compiled file.
#
# The commit-back message contains [skip ci] to avoid recursion.

on:
  push:
    branches: [master]
    paths:
      - 'src/app.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-appjs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: npm install --no-audit --no-fund

      - name: Build app.js from src/app.jsx
        run: npm run build

      - name: Commit built app.js back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          [ -f app.js.map ] && git add app.js.map || true
          if git diff --cached --quiet; then
            echo "app.js unchanged — nothing to commit."
          else
            git commit -m "build: rebuild app.js [skip ci]"
            git push
          fi
