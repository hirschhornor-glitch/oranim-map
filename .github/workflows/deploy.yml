name: Build app.js from JSX source

# Runs only when the JSX source or build config changes.
# Builds app.js and commits it back to master, so GitHub Pages
# (which deploys from master root) serves the compiled file.
#
# The commit-back message contains [skip ci] to avoid recursion.

on:
  push:
    branches: [master]
    paths:
      - 'src/app.jsx'
      - 'src/junction.jsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-appjs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel
        run: npm install --no-audit --no-fund

      - name: Build app.js + junction.js from JSX sources
        run: npm run build:all

      - name: Commit built bundles back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js junction.js
          if git diff --cached --quiet; then
            echo "bundles unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "build: rebuild app.js + junction.js [skip ci]"
          # Push with rebase-retry: other bots (summary/data updates) push to
          # master concurrently, so a bare push can be rejected non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto latest master"
            git pull --rebase origin master
          done
          echo "failed to push built bundles after 5 attempts" >&2
          exit 1
