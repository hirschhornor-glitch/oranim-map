name: Update Muni Books (מסירה בפועל)

# Refreshes data/hafrasha_delivery.json from the city's public property +
# allocation books (Power BI). The books refresh ~daily, but delivery states
# (asset opened / ownership registered) move on a weeks-to-months scale, so a
# weekly pull is plenty. Raw books land in scripts/sources/ (gitignored) —
# only the slim join is committed.

on:
  schedule:
    - cron: '15 3 * * 0'   # Weekly, Sunday 03:15 UTC (06:15 Israel)
  workflow_dispatch:         # Manual trigger

# Needed so the auto-commit step can push back to master.
permissions:
  contents: write

# Avoid clashing with the app.js rebuild (deploy.yml) when both push to master.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Persist PAT credentials so `git push` works (the default GITHUB_TOKEN
          # is read-only here — without this the push fails silently). Mirrors
          # deploy.yml / update_tree_permits.yml.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install shapely pyproj

      - name: Fetch muni books (Power BI → scripts/sources/)
        run: python scripts/fetch_muni_books.py

      - name: Build delivery join (→ data/hafrasha_delivery.json)
        run: python scripts/build_hafrasha_delivery.py

      - name: Build asset allocations join (→ data/asset_allocations.json)
        run: python scripts/build_asset_allocations.py

      # NOTE: the gisviewer.jerusalem.muni.il fetches (excavation permits,
      # permit GIS points, ortho quarters) used to run here but the muni WAF
      # returns HTTP 403 to GitHub's datacenter IPs — they failed on EVERY run
      # (2026-07-05 .. 2026-07-13) and only turned this job red. They work from
      # a residential Israeli IP, so as of 2026-07-15 they run weekly on the
      # local machine instead: C:\ORANIM\run_weekly_muni_gis.bat →
      # weekly_muni_gis.py (Windows Task Scheduler), which commits + pushes
      # data/{excavation_permits,permit_gis_points,unassigned_permits,ortho_quarters}
      # directly. Do NOT re-add them here — GitHub cannot reach the muni server.

      # תמ"א 18 — public lots near fuel stations. OSM Overpass + local landuse
      # files; falls back to the committed stations list if Overpass is down.
      - name: Build fuel barriers (→ data/fuel_barriers.json)
        if: ${{ !cancelled() }}
        run: python scripts/build_fuel_barriers.py

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hafrasha_delivery.json data/asset_allocations.json data/fuel_barriers.json
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
            exit 0
          fi
          git commit -m "auto: update muni books + GIS layers data [skip ci]"
          # Rebase onto any concurrent pushes (deploy bot, data cron) then push.
          # No `|| true` — a real push failure should surface, not hide.
          git pull --rebase --autostash origin master
          git push
