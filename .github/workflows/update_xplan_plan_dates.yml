name: Update XPLAN plan dates

on:
  schedule:
    # שבועי — ראשון 05:00 UTC, אחרי detect_new_plans (04:00) כדי שתכניות חדשות יקבלו תאריך קליטה.
    - cron: '0 5 * * 0'
  workflow_dispatch:   # הפעלה ידנית

# נדרש כדי שצעד ה-commit האוטומטי יוכל לדחוף חזרה ל-master.
permissions:
  contents: write

# מונע התנגשות עם בניית app.js (deploy.yml) כששניהם דוחפים ל-master.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch receiving dates + units (XPLAN/1 → data/xplan_plan_dates.json)
        run: python scripts/fetch_xplan_plan_dates.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/xplan_plan_dates.json
          if git diff --cached --quiet; then
            echo "No change in xplan_plan_dates.json — nothing to commit."
            exit 0
          fi
          git commit -m "auto: update XPLAN plan dates [skip ci]"
          git pull --rebase --autostash origin master
          git push
