<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Assistant', system-ui, sans-serif; background: #0d1b22; color: #e9eef1; overflow: hidden; }
        #root { height: 100vh; width: 100vw; }
        .leaflet-container { background: #0d1b22; font-family: 'Assistant', sans-serif; }
        .lbl-badge { background: rgba(15,30,38,.85); color:#cfe; border:1px solid #2b5;
            font-size:10px; padding:0 3px; border-radius:3px; white-space:nowrap; }
        .lbl-node { background: rgba(60,20,40,.85); color:#fbd; border:1px solid #b58;
            font-size:9px; padding:0 2px; border-radius:3px; white-space:nowrap; }
        .ab-pin { font-size:26px; line-height:26px; text-align:center; filter: drop-shadow(0 1px 2px #000); }
        .spin { width:34px;height:34px;border:3px solid #2c4a56;border-top-color:#39d1a8;border-radius:50%;
            animation:sp 1s linear infinite; }
        @keyframes sp { to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width:8px; height:8px; }
        ::-webkit-scrollbar-thumb { background:#2c4a56; border-radius:4px; }
        button { font-family: inherit; }
    </style>

    <div id="root">
        <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">

    </div>
